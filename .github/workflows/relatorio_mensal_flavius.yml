name: Relatório Mensal Flavius (avulso)
on:
  workflow_dispatch:
jobs:
  dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: |
          pip install requests playwright
          playwright install --with-deps chromium
      - name: Gerar relatório mensal do Flavius e enviar ao Telegram
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_GRUPO }}
          PASTA_SAIDA: /tmp/relatorios
        run: python src/relatorio_mensal_flavius.py
      - name: Guardar JSONs/PDFs como artifact (backup 30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mensal-flavius
          path: /tmp/relatorios/*
          retention-days: 30
