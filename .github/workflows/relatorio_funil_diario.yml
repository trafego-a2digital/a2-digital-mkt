name: Relatório Diário de Funil - Congressos

on:
  schedule:
    - cron: "0 9 * * *"  # 6h Brasília (UTC-3) = 9h UTC, todo dia
  workflow_dispatch: {}  # permite rodar manualmente pelo GitHub

jobs:
  enviar-relatorio-funil:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar relatório de funil
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_GRUPO_FUNIL: ${{ secrets.TELEGRAM_CHAT_ID_GRUPO_FUNIL }}
        run: python relatorio_funil_diario.py
